<style id="lock-style">
  :root { color-scheme: light dark; --bg: #f4f5f2; --card: #fff; --ink: #17201d; --ink2: #4d5753; --line: #cfd6d2; --acc: #0f766e; --bad: #a11d1d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121615; --card: #1b201f; --ink: #eef1ef; --ink2: #b9c1bd; --line: #3a4240; --acc: #2bb3a5; --bad: #ff9d9d; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink);
         font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  #unlock { width: min(360px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; text-align: center; }
  #unlock svg { width: 64px; height: 64px; }
  #unlock h1 { font-size: 22px; margin: 10px 0 2px; }
  #unlock p { margin: 0 0 16px; color: var(--ink2); font-size: 13.5px; }
  #unlock input[type=password] { width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
  #unlock input[type=password]:focus { outline: 2px solid var(--acc); outline-offset: 1px; }
  #unlock label { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 12px 0; font-size: 13.5px; color: var(--ink2); }
  #unlock button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--acc); color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  #unlock input[type=checkbox] { accent-color: var(--acc); }
  #unlock button:disabled { opacity: .6; cursor: wait; }
  #unlock-error { color: var(--bad); min-height: 20px; margin: 10px 0 0; font-size: 13.5px; }
</style>
</head>

  var KEY_STORE = "ppm-data-key";
  var form = document.getElementById("unlock"), input = document.getElementById("unlock-password");
  var btn = document.getElementById("unlock-btn"), err = document.getElementById("unlock-error");

  function b64(text) { var s = atob(text), out = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; }
  function toB64(buf) { var v = new Uint8Array(buf), s = ""; for (var i = 0; i < v.length; i += 0x8000) s += String.fromCharCode.apply(null, v.subarray(i, i + 0x8000)); return btoa(s); }
  function getStored() { try { return JSON.parse(localStorage.getItem(KEY_STORE)); } catch (e) { return null; } }
  function setStored(v) { try { localStorage.setItem(KEY_STORE, JSON.stringify(v)); } catch (e) {} }
  function forget() { try { localStorage.removeItem(KEY_STORE); } catch (e) {} }

  function derive(password) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]).then(function (m) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENCRYPTED_APP.salt), iterations: ENCRYPTED_APP.iter, hash: "SHA-256" },
        m, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  function decrypt(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENCRYPTED_APP.iv) }, key, b64(ENCRYPTED_APP.data))
      .then(function (plain) { return JSON.parse(new TextDecoder().decode(plain)); });
  }

  function start(app) {
    // style ekranu hasła (m.in. wyśrodkowanie body) nie mogą zostać po odblokowaniu – inaczej rozjeżdżają układ aplikacji
    var ls = document.getElementById("lock-style"); if (ls) ls.parentNode.removeChild(ls);
    var st = document.createElement("style"); st.textContent = app.css; document.head.appendChild(st);
    document.title = "PPM – kalkulator kaloryki";
    document.body.setAttribute("data-tab", "dane");
    document.body.innerHTML = app.html;
    window.PPM_FORGET_KEY = forget;
    var sc = document.createElement("script"); sc.textContent = app.js; document.body.appendChild(sc);
  }

  function ask() {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!input.value) return;
      btn.disabled = true; err.textContent = "";
      var keyRef;
      derive(input.value).then(function (key) { keyRef = key; return decrypt(key); }).then(function (app) {
        if (document.getElementById("unlock-remember").checked)
          return crypto.subtle.exportKey("raw", keyRef).then(function (raw) { setStored({ salt: ENCRYPTED_APP.salt, key: toB64(raw) }); return app; });
        return app;
      }).then(start).catch(function () {
        err.textContent = "Nieprawidłowe hasło."; btn.disabled = false; input.select();
      });
    });
    input.focus();
  }

  if (!window.crypto || !crypto.subtle) {
    err.textContent = "Ta przeglądarka nie obsługuje odszyfrowania (wymagane HTTPS).";
    btn.disabled = true; return;
  }
  var stored = getStored();
  if (stored && stored.salt === ENCRYPTED_APP.salt) {
    crypto.subtle.importKey("raw", b64(stored.key), { name: "AES-GCM" }, true, ["decrypt"]).then(decrypt).then(start)
      .catch(function () { forget(); ask(); }); // hasło zmieniono przy publikacji – zapamiętany klucz jest nieaktualny
  } else ask();
})();
